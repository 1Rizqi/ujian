          },
          {
            q: "Penyusunan naskah proklamasi diadakan di kediaman seorang perwira tinggi militer Jepang, yaitu Laksamana Muda Tadashi Maeda (Kepala Kantor Penghubung AL). Kemukakan alasan logis mengapa rumah seorang tokoh Jepang justru dipilih sebagai tempat aman perumusan teks proklamasi Republik Indonesia!",
            ans: `Pemilihan rumah Laksamana Maeda didasarkan pada dua faktor utama:\n1. Faktor Simpati Personal: Maeda bersimpati kuat terhadap pergerakan kebangsaan Indonesia. Ia memiliki kedekatan pribadi (terutama lewat Ahmad Subarjo) dan tak keberatan dengan kemerdekaan Indonesia.\n2. Faktor Kekebalan & Keamanan: Rumah perwira tinggi militer terjamin kekebalan hukumnya (ekstrateritorial) dan aman dari razia brutal / intervensi sepihak Angkatan Darat (Kempeitai) Jepang yang sedang diinstruksikan menjaga 'Status Quo' (pembekuan status negara) oleh Sekutu.`
          },
          {
            q: "Berita tentang kemerdekaan Indonesia memicu sebuah euforia masal dan energi kebangsaan di segala penjuru daerah. Jelaskan bentuk-bentuk reaksi serta aksi-aksi nyata berskala massal yang dilakukan oleh rakyat dan pemuda pasca mendengar Proklamasi 17 Agustus 1945!",
            ans: `Reaksi rakyat bersifat aktif dan revolusioner, meliputi:\n1. Pelucutan Kekuasaan dan Persenjataan: Para pemuda menyerbu pos-pos dan markas militer Jepang untuk merampas senjata sebagai modal TKR, mengambil alih stasiun radio, pos kereta, dan fasilitas sipil lainnya.\n2. Aksi Grafiti & Vandalisme Kemerdekaan: Muncul tulisan-tulisan pro-kemerdekaan berbahasa Inggris ("Respect Our Independence", dll) di trem, gerbong, dan dinding kota sebagai bentuk psy-war menuntut Sekutu mengakui kemerdekaan RI.\n3. Penyelenggaraan Rapat Raksasa: Terkumpulnya lautan massa di Lapangan Ikada Jakarta pada 19 September 1945 sebagai demonstrasi kekuatan moral bahwa rakyat 100% mendukung Soekarno dan menantang intimidasi senjata pasukan Jepang.\n4. Penyobekan Bendera: Seperti di Surabaya, hotel Yamato diserbu karena pengibaran triwarna, lalu dirobek birunya agar menjadi dwiwarna.`
          }
        ];

        // --- Komponen Utama Aplikasi ---
        function App() {
          const [userAnswers, setUserAnswers] = useState({});
          const [isAnswerChecked, setIsAnswerChecked] = useState({});
          const [essayAnswers, setEssayAnswers] = useState({});
          const [showEssayKey, setShowEssayKey] = useState({});
          const [showBlueprint, setShowBlueprint] = useState(false);
          
          const [showScore, setShowScore] = useState(false);
          const [scoreDetails, setScoreDetails] = useState({
            answered: 0,
            correct: 0,
            wrong: 0,
            percentage: 0
          });

          const answeredCount = Object.keys(userAnswers).length;
          const correctCount = Object.keys(isAnswerChecked).filter(qIdx => isAnswerChecked[qIdx] && userAnswers[qIdx] === mcqData[qIdx].ans).length;
          const wrongCount = Object.keys(isAnswerChecked).filter(qIdx => isAnswerChecked[qIdx] && userAnswers[qIdx] !== mcqData[qIdx].ans).length;

          const handleOptionSelect = (qIndex, optIndex) => {
            if (!isAnswerChecked[qIndex]) {
              setUserAnswers(prev => ({
                ...prev,
                [qIndex]: optIndex
              }));
            }
          };

          const handleCheckAnswer = (qIndex) => {
            if (userAnswers[qIndex] !== undefined) {
              setIsAnswerChecked(prev => ({
                ...prev,
                [qIndex]: true
              }));
            }
          };

          const handleCalculateScore = () => {
            const newlyChecked = { ...isAnswerChecked };
            let correct = 0;
            
            Object.keys(userAnswers).forEach(qIdx => {
                newlyChecked[qIdx] = true;
            });
            
            setIsAnswerChecked(newlyChecked);

            let answered = Object.keys(userAnswers).length;
            Object.keys(userAnswers).forEach(qIdx => {
               if (userAnswers[qIdx] === mcqData[qIdx].ans) {
                  correct++;
               }
            });

            let wrong = answered - correct;
            let percentage = Math.round((correct / mcqData.length) * 100);

            setScoreDetails({ answered, correct, wrong, percentage });
            setShowScore(true);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
          };

          // --- Fungsi Reset Ujian ---
          const handleRetry = () => {
            // Confirm dialog for resetting progress
            if (window.confirm('Apakah Anda yakin ingin mengulangi ujian ini? Seluruh jawaban dan nilai Anda akan dihapus.')) {
              setUserAnswers({});
              setIsAnswerChecked({});
              setEssayAnswers({});
              setShowEssayKey({});
              setShowScore(false);
              setScoreDetails({ answered: 0, correct: 0, wrong: 0, percentage: 0 });
              
              // Scroll kembali ke paling atas
              window.scrollTo({ top: 0, behavior: 'smooth' });
            }
          };

          const isAnyAnswered = answeredCount > 0;

          return (
            <div className="min-h-screen pb-20 md:pb-24">
              {/* Navbar Mobile Friendly (Scrollable horizontally dengan target sentuh lega) */}
              <nav className="bg-[#1e3264] text-white py-4 px-4 md:px-8 flex gap-6 md:gap-8 text-[15px] md:text-base font-semibold sticky top-0 z-50 shadow-md overflow-x-auto whitespace-nowrap scrollbar-hide">
                <a href="#exam-hero" className="hover:text-blue-300 transition-colors shrink-0">Exam</a>
                <span className="text-gray-400 shrink-0">|</span>
                <a href="#pg-section" className="hover:text-blue-300 transition-colors shrink-0">PG 1–40</a>
                <span className="text-gray-400 shrink-0">|</span>
                <a href="#essay-section" className="hover:text-blue-300 transition-colors shrink-0">Essay 41–45</a>
              </nav>

              <main className="max-w-[900px] mx-auto px-4 mt-6 space-y-5 md:space-y-6">
                
                {/* Bagian Header Simulasi */}
                <div id="exam-hero" className="bg-[#24428b] text-white rounded-t-xl rounded-b-3xl p-5 sm:p-6 md:p-8 shadow-md relative overflow-hidden bg-gradient-to-br from-[#1e3a8a] to-[#24428b]">
                  <div className="relative z-10">
                    <p className="text-xs md:text-sm font-semibold tracking-wider text-blue-200 uppercase mb-2">
                      Sumatif Akhir Semester (SAS) • Even Semester 2025/2026
                    </p>
                    <h1 className="text-3xl sm:text-4xl font-extrabold mb-2 tracking-tight">SEJARAH INDONESIA</h1>
                    <p className="text-blue-100 mb-6 md:mb-8 text-sm md:text-base">Kelas XI • Semester 2 Genap • SMA/MA</p>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                      <div className="bg-white/10 backdrop-blur-sm rounded-lg p-3 md:p-4 border border-white/20">
                        <p className="text-[10px] uppercase text-blue-200 font-bold mb-1 tracking-wider">Total Questions</p>
                        <p className="font-bold text-base md:text-lg">45 (40 PG + 5 Essay)</p>
                      </div>
                      <div className="bg-white/10 backdrop-blur-sm rounded-lg p-3 md:p-4 border border-white/20">
                        <p className="text-[10px] uppercase text-blue-200 font-bold mb-1 tracking-wider">Time Allowed</p>
                        <p className="font-bold text-base md:text-lg">90 Minutes</p>
                      </div>
                      <div className="bg-white/10 backdrop-blur-sm rounded-lg p-3 md:p-4 border border-white/20 col-span-2 md:col-span-1">
                        <p className="text-[10px] uppercase text-blue-200 font-bold mb-1 tracking-wider">Academic Year</p>
                        <p className="font-bold text-base md:text-lg">2025 / 2026</p>
                      </div>
                    </div>
                  </div>
                  <div className="absolute top-0 right-0 w-[400px] h-[400px] rounded-full bg-white opacity-5 translate-x-1/3 -translate-y-1/3"></div>
                </div>

                {/* Dashboard Hitung Skor */}
                <div className="bg-white border border-gray-200 rounded-xl p-5 sm:p-6 md:p-8 shadow-sm">
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mb-5 md:mb-6">
                    <div className="text-center p-3 sm:p-4 bg-gray-50 rounded-lg border border-gray-100 shadow-sm">
                      <p className="text-2xl sm:text-3xl font-black text-gray-800">{mcqData.length + essayData.length}</p>
                      <p className="text-xs text-gray-500 mt-1">Total</p>
                    </div>
                    <div className="text-center p-3 sm:p-4 bg-gray-50 rounded-lg border border-gray-100 shadow-sm">
                      <p className="text-2xl sm:text-3xl font-black text-blue-600">{answeredCount}</p>
                      <p className="text-xs text-gray-500 mt-1">Answered</p>
                    </div>
                    <div className="text-center p-3 sm:p-4 bg-gray-50 rounded-lg border border-gray-100 shadow-sm">
                      <p className="text-2xl sm:text-3xl font-black text-green-500">{correctCount}</p>
                      <p className="text-xs text-gray-500 mt-1">Correct (PG)</p>
                    </div>
                    <div className="text-center p-3 sm:p-4 bg-gray-50 rounded-lg border border-gray-100 shadow-sm">
                      <p className="text-2xl sm:text-3xl font-black text-red-500">{wrongCount}</p>
                      <p className="text-xs text-gray-500 mt-1">Wrong (PG)</p>
                    </div>
                  </div>

                  {!showScore ? (
                    <div className="flex flex-col items-center w-full">
                      <button 
                        onClick={handleCalculateScore}
                        disabled={!isAnyAnswered}
                        className={`w-full py-4 rounded-lg flex items-center justify-center font-bold text-base md:text-lg transition-all shadow-md ${
                          isAnyAnswered ? 'bg-[#24428b] hover:bg-[#152c6b] text-white cursor-pointer active:scale-[0.98]' : 'bg-[#24428b]/60 text-white/70 cursor-not-allowed'
                        }`}
                      >
                        <TrendingUp className="w-5 h-5 mr-2" />
                        Calculate My Score
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col w-full gap-4">
                      <div className={`p-6 md:p-8 rounded-lg text-center border animate-in ${
                        scoreDetails.percentage >= 75 ? 'bg-green-50 border-green-200' : 
                        scoreDetails.percentage >= 50 ? 'bg-yellow-50 border-yellow-200' : 
                        'bg-[#ffe4e6] border-red-200'
                      }`}>
                        <h2 className={`text-4xl sm:text-5xl font-black mb-2 ${
                            scoreDetails.percentage >= 75 ? 'text-green-800' : 
                            scoreDetails.percentage >= 50 ? 'text-yellow-800' : 
                            'text-[#111827]'
                        }`}>
                          {scoreDetails.percentage}% ({scoreDetails.correct}/{mcqData.length})
                        </h2>
                        <p className="font-medium text-gray-700 text-sm sm:text-base">
                          {scoreDetails.percentage >= 75 ? 'Luar biasa! Pemahamanmu sangat baik.' : 
                           scoreDetails.percentage >= 50 ? 'Kerja bagus, tapi terus ulangi materinya ya!' : 
                           'Teruslah berlatih, kamu pasti bisa!'}
                        </p>
                      </div>
                      <button 
                        onClick={handleRetry}
                        className="w-full py-3.5 rounded-lg flex items-center justify-center font-bold text-base transition-all border-2 border-gray-300 text-gray-700 hover:bg-gray-50 active:scale-[0.98]"
                      >
                        <RefreshCcw className="w-5 h-5 mr-2" />
                        Ulangi Ujian (Reset)
                      </button>
                    </div>
                  )}
                </div>

                {/* Box Kisi-Kisi */}
                <div className="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                  <button 
                    onClick={() => setShowBlueprint(!showBlueprint)}
                    className="w-full flex justify-between items-center p-4 sm:p-5 bg-gray-50 hover:bg-gray-100 transition-colors"
                  >
                    <span className="flex items-center font-semibold text-gray-800 text-[15px] sm:text-base">
                      <FileText className="w-5 h-5 mr-3 text-orange-500 flex-shrink-0" />
                      Kisi-Kisi / Question Blueprint
                    </span>
                    <span className="text-gray-600 text-sm font-semibold flex items-center">
                      {showBlueprint ? (
                        <span className="flex items-center"><ChevronUp className="w-4 h-4 mr-1" /> Hide</span>
                      ) : (
                        <span className="flex items-center"><ChevronDown className="w-4 h-4 mr-1" /> Show</span>
                      )}
                    </span>
                  </button>
                  
                  {showBlueprint && (
                    <div className="p-5 sm:p-6 border-t border-gray-200 bg-white text-[15px] text-gray-600 leading-relaxed animate-in">
                      <p className="mb-3"><strong>Capaian Pembelajaran:</strong> Peserta didik mampu menganalisis munculnya kesadaran kebangsaan dan pergerakan nasional Indonesia pada masa kolonial serta memahami peran tokoh, organisasi, dan media dalam memperjuangkan kemerdekaan.</p>
                      <ul className="list-disc pl-5 space-y-1.5 text-gray-700">
                        <li>Memahami latar belakang ekspansi Jepang ke Asia</li>
                        <li>Menganalisis sistem pemerintahan dan eksploitasi militer Jepang</li>
                        <li>Mengevaluasi dampak penjajahan di bidang sosial, ekonomi, pendidikan</li>
                        <li>Memahami dinamika respon bangsa Indonesia: kooperatif vs bawah tanah</li>
                        <li>Menganalisis kronologi proklamasi dan tokoh yang terlibat</li>
                        <li>Mengevaluasi respon rakyat pasca kemerdekaan di berbagai daerah</li>
                      </ul>
                    </div>
                  )}
                </div>

                {/* Instruksi Pengerjaan */}
                <div className="bg-white border border-gray-200 rounded-xl p-5 sm:p-6 md:p-8 shadow-sm">
                  <h3 className="flex items-center font-bold text-gray-900 text-base md:text-lg mb-4 md:mb-5">
                    <Pin className="w-5 h-5 mr-3 text-red-600 flex-shrink-0" /> 
                    General Instructions
                  </h3>
                  <ul className="list-disc pl-5 sm:pl-6 space-y-2 md:space-y-3 text-gray-600 text-[15px] md:text-base leading-relaxed">
                    <li>Baca setiap soal dengan teliti sebelum menjawab.</li>
                    <li><strong>Section A (Q1–40):</strong> Pilih jawaban terbaik: A, B, C, D, atau E dengan menyentuh pilihan yang ada.</li>
                    <li><strong>Section B (Q41–45):</strong> Jawab menggunakan kalimat lengkap pada kotak jawaban yang tersedia.</li>
                    <li>Tekan tombol <em>Cek Jawaban</em> untuk memeriksa pilihanmu dan memunculkan kotak pembahasan untuk belajar.</li>
                    <li>Batas waktu yang disarankan: <strong>90 menit</strong>.</li>
                  </ul>
                </div>

                {/* ============================================================
                    SECTION A: PILIHAN GANDA 
                    ============================================================ */}
                <div id="pg-section" className="pt-6 md:pt-8">
                  <h2 className="text-xl sm:text-2xl font-bold text-[#1e3264] mb-5 md:mb-6 border-b-2 border-gray-200 pb-3">
                    Section A: Pilihan Ganda (Q1 - Q40)
                  </h2>
                  
                  <div className="space-y-5 md:space-y-6">
                    {mcqData.map((currentMcq, currentMcqIndex) => {
                      const hasSelected = userAnswers[currentMcqIndex] !== undefined;
                      const isChecked = isAnswerChecked[currentMcqIndex];
                      const isCorrect = userAnswers[currentMcqIndex] === currentMcq.ans;

                      return (
                        <div key={currentMcqIndex} className="bg-white border border-gray-200 rounded-xl p-4 sm:p-6 md:p-8 shadow-sm hover:shadow-md transition-shadow relative overflow-hidden">
                          <div className="flex flex-col sm:flex-row gap-2 sm:gap-4 md:gap-5">
                            <div className="font-extrabold text-xl sm:text-2xl text-[#1e3264] w-full sm:w-8 flex-shrink-0 mt-0 sm:mt-1 mb-2 sm:mb-0 border-b border-gray-100 sm:border-none pb-2 sm:pb-0">
                              {currentMcqIndex + 1}.
                            </div>
                            <div className="flex-1">
                              <div className="mb-3 sm:mb-4">
                                <span className="inline-flex items-center px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-full text-[11px] sm:text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 shadow-sm">
                                  <Lightbulb className="w-3 h-3 sm:w-3.5 sm:h-3.5 mr-1 sm:mr-1.5 text-indigo-500" />
                                  Topik: {currentMcq.materi}
                                </span>
                              </div>

                              <p className="text-base sm:text-lg md:text-xl text-gray-800 leading-relaxed font-medium mb-5">
                                {currentMcq.q}
                              </p>

                              <div className="space-y-3 mb-5">
                                {currentMcq.options.map((opt, idx) => {
                                  const letter = String.fromCharCode(65 + idx);
                                  const isSelected = userAnswers[currentMcqIndex] === idx;
                                  const isCorrectAns = currentMcq.ans === idx;
                                  
                                  let styleClass = "border-gray-200 hover:border-[#24428b] hover:bg-blue-50 text-gray-700 bg-white shadow-sm";
                                  if (isSelected) styleClass = "border-[#24428b] bg-blue-50 ring-2 ring-[#24428b] text-[#1e3264] shadow-md";
                                  
                                  if (isChecked) {
                                    if (isCorrectAns) {
                                      styleClass = "border-green-500 bg-green-50 ring-2 ring-green-500 text-green-900 font-medium shadow-md";
                                    } else if (isSelected) {
                                      styleClass = "border-orange-500 bg-orange-50 ring-2 ring-orange-500 text-orange-900 opacity-90 shadow-sm";
                                    } else {
                                      styleClass = "border-gray-200 opacity-40 bg-gray-50 shadow-none";
                                    }
                                  }

                                  return (
                                    <button
                                      key={idx}
                                      onClick={() => handleOptionSelect(currentMcqIndex, idx)}
                                      disabled={isChecked}
                                      className={`w-full text-left p-3.5 sm:p-4 rounded-xl border transition-all duration-200 flex items-start transform ${isChecked ? 'cursor-default' : 'cursor-pointer hover:-translate-y-0.5 active:scale-[0.98]'} ${styleClass}`}
                                    >
                                      <span className="font-bold mr-3 sm:mr-4 mt-0.5 w-6 flex-shrink-0 text-center">{letter}.</span>
                                      <span className="leading-relaxed text-[15px] sm:text-base">{opt}</span>
                                      
                                      {isChecked && isCorrectAns && (
                                        <CheckCircle2 className="w-5 h-5 sm:w-6 sm:h-6 text-green-600 ml-auto flex-shrink-0 mt-0.5" />
                                      )}
                                      {isChecked && isSelected && !isCorrectAns && (
                                        <XCircle className="w-5 h-5 sm:w-6 sm:h-6 text-orange-600 ml-auto flex-shrink-0 mt-0.5" />
                                      )}
                                    </button>
                                  );
                                })}
                              </div>

                              <div className="flex flex-col sm:flex-row items-center justify-end border-t border-gray-100 pt-4 gap-3">
                                {!isChecked ? (
                                  <button
                                    onClick={() => handleCheckAnswer(currentMcqIndex)}
                                    disabled={!hasSelected}
                                    className={`w-full sm:w-auto py-3.5 sm:py-2 px-6 rounded-lg sm:rounded-md font-semibold text-[15px] sm:text-sm transition-colors flex items-center justify-center ${
                                      hasSelected 
                                        ? 'bg-white border-2 border-[#24428b] text-[#24428b] hover:bg-blue-50 cursor-pointer shadow-sm hover:shadow-md active:bg-blue-100' 
                                        : 'bg-gray-100 text-gray-400 border border-gray-200 cursor-not-allowed'
                                    }`}
                                  >
                                    <CheckSquare className="w-4 h-4 mr-2" />
                                    Cek Jawaban
                                  </button>
                                ) : (
                                  <span className={`w-full sm:w-auto justify-center font-bold px-4 py-3 sm:py-1.5 rounded-lg sm:rounded-md flex items-center text-[15px] sm:text-sm ${isCorrect ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-orange-100 text-orange-800 border border-orange-200'}`}>
                                    {isCorrect ? (
                                      <span className="flex items-center"><CheckCircle2 className="w-4 h-4 mr-2" /> Jawaban Benar!</span>
                                    ) : (
                                      <span className="flex items-center"><XCircle className="w-4 h-4 mr-2" /> Jawaban Salah!</span>
                                    )}
                                  </span>
                                )}
                              </div>

                              {isChecked && (
                                <div className={`mt-5 sm:mt-6 p-4 sm:p-5 md:p-6 border-l-4 rounded-r-xl rounded-l-sm shadow-inner animate-in ${
                                  isCorrect ? 'bg-green-50 border-green-500' : 'bg-orange-50 border-orange-500'
                                }`}>
                                  <h4 className={`flex items-center font-bold mb-2 sm:mb-3 text-[15px] sm:text-base ${
                                    isCorrect ? 'text-green-800' : 'text-orange-800'
                                  }`}>
                                    {isCorrect ? <CheckCircle2 className="w-5 h-5 mr-2 flex-shrink-0" /> : <AlertCircle className="w-5 h-5 mr-2 flex-shrink-0" />}
                                    {isCorrect ? 'Luar Biasa! Jawabanmu Tepat' : 'Mari Pahami Bersama (Pembahasan)'}
                                  </h4>
                                  <p className="text-gray-700 leading-relaxed text-[14px] sm:text-[15px] md:text-base">
                                    {currentMcq.pembahasan}
                                  </p>
                                </div>
                              )}

                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* ============================================================
                    SECTION B: URAIAN
                    ============================================================ */}
                <div id="essay-section" className="pt-8 sm:pt-10">
                  <h2 className="text-xl sm:text-2xl font-bold text-[#1e3264] mb-5 md:mb-6 border-b-2 border-gray-200 pb-3">
                    Section B: Soal Uraian (Q41 - Q45)
                  </h2>

                  <div className="space-y-5 md:space-y-6">
                    {essayData.map((essay, index) => {
                      const globalIndex = mcqData.length + index + 1;
                      
                      return (
                        <div key={index} className="bg-white border border-gray-200 rounded-xl p-4 sm:p-6 md:p-8 shadow-sm">
                          <div className="flex flex-col sm:flex-row gap-2 sm:gap-4 md:gap-5 mb-4 sm:mb-5">
                            <div className="font-extrabold text-xl sm:text-2xl text-gray-800 w-full sm:w-8 flex-shrink-0 border-b border-gray-100 sm:border-none pb-2 sm:pb-0">
                              {globalIndex}.
                            </div>
                            <div className="flex-1">
                              <p className="text-base sm:text-lg text-gray-800 leading-relaxed font-medium mt-1 sm:mt-0">
                                {essay.q}
                              </p>
                            </div>
                          </div>

                          <div className="ml-0 sm:ml-12 md:ml-12 mb-5">
                            <label className="block text-[13px] sm:text-sm font-semibold text-gray-500 mb-2 uppercase tracking-wide">Box Jawaban / Answer Box</label>
                            <textarea 
                              value={essayAnswers[index] || ''}
                              onChange={(e) => setEssayAnswers(prev => ({...prev, [index]: e.target.value}))}
                              placeholder="Ketik jawabanmu di sini menggunakan kalimat yang lengkap..."
                              className="w-full min-h-[140px] p-4 border border-gray-300 rounded-xl focus:ring-2 focus:ring-[#24428b] focus:border-[#24428b] outline-none transition-all resize-y text-gray-800 bg-[#f8fafc] focus:bg-white text-[15px] sm:text-base"
                            ></textarea>
                          </div>

                          <div className="ml-0 sm:ml-12 md:ml-12 flex flex-col sm:flex-row justify-end border-t border-gray-100 pt-4">
                            <button
                              onClick={() => setShowEssayKey(prev => ({...prev, [index]: !prev[index]}))}
                              className="w-full sm:w-auto py-3.5 sm:py-2 px-6 bg-white border border-gray-300 text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300 rounded-lg sm:rounded-md font-semibold transition-colors flex items-center justify-center text-[15px] sm:text-sm active:bg-gray-100"
                            >
                              <BookOpen className="w-4 h-4 mr-2" />
                              {showEssayKey[index] ? 'Sembunyikan Panduan' : 'Lihat Panduan Jawaban'}
                            </button>
                          </div>

                          {showEssayKey[index] && (
                            <div className="ml-0 sm:ml-12 md:ml-12 mt-4 sm:mt-5 p-4 sm:p-5 md:p-6 bg-emerald-50 border-l-4 border-emerald-500 rounded-r-xl rounded-l-sm shadow-sm animate-in">
                              <h4 className="font-bold text-emerald-800 mb-2 sm:mb-3 flex items-center text-[15px] sm:text-base">
                                <PenTool className="w-4 h-4 sm:w-5 sm:h-5 mr-2 text-emerald-600 flex-shrink-0" /> Rubrik Penilaian & Kunci Jawaban
                              </h4>
                              <div className="text-gray-800 whitespace-pre-line leading-relaxed text-[14px] sm:text-[15px] md:text-base">
                                {essay.ans}
                              </div>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="py-10 md:py-12 pb-16 flex flex-col items-center justify-center border-t-2 border-gray-200 mt-8 md:mt-10">
                  {!showScore ? (
                    <div className="flex flex-col items-center w-full">
                      <p className="text-gray-500 mb-4 font-medium text-center text-sm md:text-base">Sudah selesai mengerjakan semua soal?</p>
                      <button 
                        onClick={handleCalculateScore}
                        className="w-full sm:w-auto py-4 px-10 bg-[#24428b] hover:bg-[#152c6b] text-white rounded-xl font-bold text-base md:text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1 active:scale-[0.98] flex items-center justify-center"
                      >
                        <TrendingUp className="w-6 h-6 mr-3" />
                        Hitung Nilai Saya Sekarang
                      </button>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center w-full">
                      <p className="text-gray-500 mb-4 font-medium text-center text-sm md:text-base">Ingin mengulangi dari awal?</p>
                      <button 
                        onClick={handleRetry}
                        className="w-full sm:w-auto py-4 px-10 bg-white border-2 border-gray-300 text-gray-700 hover:bg-gray-50 rounded-xl font-bold text-base md:text-lg shadow-sm hover:shadow-md transition-all active:scale-[0.98] flex items-center justify-center"
                      >
                        <RefreshCcw className="w-6 h-6 mr-3" />
                        Ulangi Ujian (Reset)
                      </button>
                    </div>
                  )}
                </div>

              </main>
            </div>
          );
        }

        // --- Inisialisasi React DOM ke Element HTML ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
